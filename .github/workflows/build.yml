name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple code signing certificate (macOS only)
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
          rm -f certificate.p12

      - name: Build Tauri app
        run: |
          node ./node_modules/@tauri-apps/cli/tauri.js --version
          node ./node_modules/@tauri-apps/cli/tauri.js build --ci ${{ matrix.target && format('--target {0}', matrix.target) || '' }} 2>&1 | tee tauri-build.log
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}

      - name: List build output structure (debug)
        continue-on-error: true
        run: |
          echo "=== target/release ==="
          find src-tauri/target/release -maxdepth 3 -type d 2>/dev/null || echo "(no release dir)"
          echo "=== target/*/release ==="
          find src-tauri/target -name "release" -type d -maxdepth 3 2>/dev/null || echo "(no target dir matches)"
          echo "=== bundle dirs ==="
          find src-tauri/target -name "bundle" -type d 2>/dev/null || echo "(no bundle dirs)"

      - name: Upload build debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ matrix.platform == 'macos-latest' && 'macOS' || 'Windows' }}-${{ github.sha }}
          path: tauri-build.log
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.platform == 'macos-latest' && 'macOS' || 'Windows' }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
